name: Build Installers (Android, iOS, macOS, Windows, Linux)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: luch-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Linux (.deb & tar.gz)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package .deb
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh 1.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: luch-linux-deb
          path: build/deb/*.deb

  build-windows:
    name: Windows (.exe Setup & zip)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build Inno Setup installer
        run: iscc packaging/windows/luch_setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: luch-windows-installer
          path: packaging/windows/Output/Luch-Windows-Setup.exe

  build-ios:
    name: iOS (unsigned .ipa)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa (for AltStore / Sideloadly / re-signing)
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -r Luch-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: luch-ios-ipa
          path: build/ipa/Luch-iOS-unsigned.ipa

  build-macos:
    name: macOS (.dmg)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package .dmg
        run: |
          mkdir -p build/dmg-staging build/dmg
          cp -R build/macos/Build/Products/Release/luch.app build/dmg-staging/Луч.app
          ln -s /Applications build/dmg-staging/Applications
          hdiutil create -volname "Луч" -srcfolder build/dmg-staging -ov -format UDZO build/dmg/Luch-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: luch-macos-dmg
          path: build/dmg/Luch-macOS.dmg
